name: Railway Weekly Redeploy

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  redeploy:
    if: ${{ vars.RAILWAY_WEEKLY_REDEPLOY_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "Missing one or more required Railway secrets."
            exit 1
          fi

          payload="$(jq -n \
            --arg environmentId "${RAILWAY_ENVIRONMENT_ID}" \
            --arg projectId "${RAILWAY_PROJECT_ID}" \
            --arg serviceId "${RAILWAY_SERVICE_ID}" \
            '{
              query: "mutation ServiceInstanceRedeploy($environmentId: String!, $projectId: String!, $serviceId: String!) { serviceInstanceRedeploy(environmentId: $environmentId, projectId: $projectId, serviceId: $serviceId) }",
              variables: {environmentId: $environmentId, projectId: $projectId, serviceId: $serviceId}
            }')"

          if ! response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://backboard.railway.com/graphql/v2" \
            --header "Authorization: Bearer ${RAILWAY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${payload}")"; then
            echo "${response}"
            echo "Railway redeploy request failed."
            exit 1
          fi

          echo "${response}"
          # GraphQL reports failures with HTTP 200 and an "errors" array.
          if echo "${response}" | jq -e '.errors' > /dev/null; then
            echo "Railway redeploy failed."
            exit 1
          fi
